apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  labels:
    app.kubernetes.io/name: sample-web
    app.kubernetes.io/part-of: sample-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-web
        app.kubernetes.io/part-of: sample-application
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.4-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
