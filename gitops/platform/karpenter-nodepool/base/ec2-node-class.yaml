apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
  labels:
    app.kubernetes.io/component: node-provisioning
    app.kubernetes.io/managed-by: kustomize
spec:
  # Replace with the Karpenter node IAM role created for this cluster.
  role: KarpenterNodeRole-REPLACE_ME
  amiFamily: AL2023
  # Pin a release-compatible alias in each environment overlay.
  amiSelectorTerms:
    - alias: al2023@REPLACE_ME
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
